[package]
name = "bof2exe"
version = "0.4.1"
edition = "2021"
description = "Turn Windows BOFs into standalone command-line tools"
default-run = "bof2exe"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bof", "coff", "cli", "windows"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "string"] }
crc32fast = "1.5"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

[dev-dependencies]
find-msvc-tools = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
